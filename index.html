<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <link rel="stylesheet" href="./style.css">
    <title>ESP Voice · Controle por voz</title>
</head>
<body>
    <main class="container">
        <div class="brand" aria-hidden="true">EV</div>
        <p class="eyebrow">ESP Voice</p>
        <h1>Controle por voz</h1>
        <p class="intro">Diga <strong>“ligar”</strong> ou <strong>“desligar”</strong> para controlar o dispositivo.</p>
        <button id="startButton" class="voice-button" type="button" aria-describedby="speechStatus"><span class="microphone" aria-hidden="true">🎙️</span><span id="buttonLabel">Falar</span></button>
        <section class="status-card" aria-live="polite">
            <div class="status-heading"><span id="motorIndicator" class="indicator" aria-hidden="true"></span><span id="motorStatus">Aguardando conexão</span></div>
            <p id="speechStatus">Toque no botão e fale um comando.</p>
        </section>
        <section class="transcript" aria-label="Último comando reconhecido"><span>Você disse</span><p id="result">Nenhum comando ainda.</p></section>
    </main>
    <script type="module" src="./main.js"></script>
</body>
</html>
